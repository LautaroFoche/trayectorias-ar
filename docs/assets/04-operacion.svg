<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Publicar sólo una versión completa">
<rect width="1440" height="900" fill="#101c2a"/>
<rect x="56" y="54" width="56" height="6" fill="#52dbc0"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="56" y="99" fill="#52dbc0" font-size="18" letter-spacing="3">TRAYECTORIAS AR / INGENIERÍA DE DATOS / 04</text>
<text x="56" y="160" fill="#ffffff" font-size="42" font-weight="bold">Publicar sólo una versión completa</text>
<text x="56" y="202" fill="#b7c8da" font-size="20">Airflow: preflight → build_release → verify_release. Un proceso conserva el lock durante la construcción.</text>
<rect x="56" y="250" width="426" height="240" rx="16" fill="#1b2d40" stroke="#34516b"/>
<text x="78" y="287" fill="#52dbc0" font-size="16">01</text>
<text x="78" y="325" fill="#fff" font-size="23" font-weight="bold">Preflight</text>
<text x="78" y="364" fill="#d1deeb" font-size="17">Verificar entorno y configuración</text>
<text x="78" y="392" fill="#d1deeb" font-size="17">Fuentes disponibles / modo offline</text>
<text x="78" y="420" fill="#d1deeb" font-size="17">DAG: máximo una ejecución activa</text>
<rect x="502" y="250" width="426" height="240" rx="16" fill="#1b2d40" stroke="#34516b"/>
<text x="524" y="287" fill="#52dbc0" font-size="16">02</text>
<text x="524" y="325" fill="#fff" font-size="23" font-weight="bold">Construir</text>
<text x="524" y="364" fill="#d1deeb" font-size="17">Capturar → normalizar → cargar</text>
<text x="524" y="392" fill="#d1deeb" font-size="17">dbt build → catálogo → exportar</text>
<text x="524" y="420" fill="#d1deeb" font-size="17">Logs y run.json por intento</text>
<rect x="948" y="250" width="426" height="240" rx="16" fill="#1b2d40" stroke="#34516b"/>
<text x="970" y="287" fill="#52dbc0" font-size="16">03</text>
<text x="970" y="325" fill="#fff" font-size="23" font-weight="bold">Validar</text>
<text x="970" y="364" fill="#d1deeb" font-size="17">Contratos Python + tests SQL</text>
<text x="970" y="392" fill="#d1deeb" font-size="17">Contenido y enlaces de la web</text>
<text x="970" y="420" fill="#d1deeb" font-size="17">Cloud: comparación con DuckDB</text>
<rect x="56" y="515" width="426" height="240" rx="16" fill="#1b2d40" stroke="#34516b"/>
<text x="78" y="552" fill="#52dbc0" font-size="16">04</text>
<text x="78" y="590" fill="#fff" font-size="23" font-weight="bold">Publicar</text>
<text x="78" y="629" fill="#d1deeb" font-size="17">Reemplazar reports/current</text>
<text x="78" y="657" fill="#d1deeb" font-size="17">Web + warehouse + exports</text>
<text x="78" y="685" fill="#d1deeb" font-size="17">Lock local para excluir escritores</text>
<rect x="502" y="515" width="426" height="240" rx="16" fill="#1b2d40" stroke="#34516b"/>
<text x="524" y="552" fill="#52dbc0" font-size="16">05</text>
<text x="524" y="590" fill="#fff" font-size="23" font-weight="bold">Si ocurre un fallo</text>
<text x="524" y="629" fill="#d1deeb" font-size="17">No mover el puntero publicado</text>
<text x="524" y="657" fill="#d1deeb" font-size="17">Retener logs del intento</text>
<text x="524" y="685" fill="#d1deeb" font-size="17">Corregir causa antes de reintentar</text>
<rect x="948" y="515" width="426" height="240" rx="16" fill="#1b2d40" stroke="#34516b"/>
<text x="970" y="552" fill="#52dbc0" font-size="16">06</text>
<text x="970" y="590" fill="#fff" font-size="23" font-weight="bold">Recuperar</text>
<text x="970" y="629" fill="#d1deeb" font-size="17">Reusar manifiestos del release</text>
<text x="970" y="657" fill="#d1deeb" font-size="17">Verificar hashes de snapshots</text>
<text x="970" y="685" fill="#d1deeb" font-size="17">Replay offline y control final</text>
<text x="56" y="837" fill="#96b0c8" font-size="17">Calendario mensual configurado; scheduler persistente pendiente. El lock actual no coordina equipos distintos.</text></g></svg>