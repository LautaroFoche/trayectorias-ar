services:
  pipeline:
    build: .
    volumes:
      - ./data:/app/data:z
      - ./reports:/app/reports:z
    command: []
  report:
    image: python:3.13-slim
    working_dir: /report
    command: [python, -m, http.server, '8080', --bind, 0.0.0.0]
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./reports:/report:ro,z']
    profiles: [report]
