trayectorias_ar:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DBT_WAREHOUSE', '../data/warehouse.duckdb') }}"
      schema: analytics
      threads: 2
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRAYECTORIAS_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'TRAYECTORIAS_AR') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRAYECTORIAS_WH') }}"
      schema: ANALYTICS
      threads: 2
